# Twike charger controller
# Waveshare ESP32-S3-POE-ETH-8DI-8DO (ESP32-S3-WROOM-1U-N16R8)
# https://www.waveshare.com/wiki/ESP32-S3-POE-ETH-8DI-8DO
#
# Outbound-only: Ethernet (DHCP) -> MQTT over TLS (EMQX Cloud). No native API.
# All safety logic lives here, so it keeps working without the cloud.
#
# IO mapping (verified with the PlatformIO IO check, except Ethernet):
#   DI1 = GPIO4, active low, needs pull-up       -> Twike plugged in
#   DO1..DO3 = TCA9554 @0x20 pins 0..2, active low
#     DO1 = charger stage 1, DO2 = charger stage 2, DO3 = heating
#
# Energy: polls a Shelly Pro EM-50 over local HTTP and publishes live power,
# current, today's energy and these retained messages:
#   twike-charger/energy/day/YYYY-MM-DD = Wh (one per finished day)
#   twike-charger/energy/current_history = 5 min average current, last 24 h (JSON)

substitutions:
  name: twike-charger
  friendly_name: Twike Charger
  # Hard caps that apply even if the phone/cloud never sends OFF
  max_charge_time: 10h
  max_heating_time: 2h
  # Ignore switch commands this long after (re)connecting to MQTT, so a
  # stale retained ON on a command topic can't start charging after a reboot
  command_arm_delay: 5s
  # Shelly Pro EM-50 on the LAN (reserve this IP in the router)
  shelly_host: 192.168.1.161
  # Measuring channel the phase is on (0 or 1)
  shelly_channel: "0"
  shelly_poll_interval: 30s

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2025.5.0
  # 5 min average current for the last 24 h (RAM; restored from MQTT on boot)
  includes:
    - sample_history.h

esp32:
  board: esp32-s3-devkitc-1
  flash_size: 16MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

# Native USB-C port (USB Serial/JTAG)
logger:
  hardware_uart: USB_SERIAL_JTAG

# W5500 over SPI, IP via DHCP. Pins from the Waveshare demo code, not yet
# confirmed on hardware: if the link never comes up, check these against the
# schematic.
ethernet:
  type: W5500
  clk_pin: GPIO15
  mosi_pin: GPIO13
  miso_pin: GPIO14
  cs_pin: GPIO16
  interrupt_pin: GPIO12
  reset_pin: GPIO39
  clock_speed: 20MHz

ota:
  - platform: esphome
    password: !secret ota_password

mqtt:
  id: mqtt_client
  broker: !secret mqtt_broker
  port: 8883
  username: !secret mqtt_username
  password: !secret mqtt_password
  client_id: ${name}
  topic_prefix: twike-charger
  discovery: true
  # Availability: twike-charger/status = online/offline (retained)
  birth_message:
    topic: twike-charger/status
    payload: online
    retain: true
  will_message:
    topic: twike-charger/status
    payload: offline
    retain: true
  shutdown_message:
    topic: twike-charger/status
    payload: offline
    retain: true
  # DigiCert Global Root G2 (EMQX Cloud Serverless)
  # SHA256 CB:3C:CB:B7:60:31:E5:E0:13:8F:8D:D3:9A:23:F9:DE:47:FF:C3:5E:43:C1:14:4C:EA:27:D4:6A:5A:B1:CB:5F
  # Valid until 2038-01-15
  certificate_authority: |
    -----BEGIN CERTIFICATE-----
    MIIDjjCCAnagAwIBAgIQAzrx5qcRqaC7KGSxHQn65TANBgkqhkiG9w0BAQsFADBh
    MQswCQYDVQQGEwJVUzEVMBMGA1UEChMMRGlnaUNlcnQgSW5jMRkwFwYDVQQLExB3
    d3cuZGlnaWNlcnQuY29tMSAwHgYDVQQDExdEaWdpQ2VydCBHbG9iYWwgUm9vdCBH
    MjAeFw0xMzA4MDExMjAwMDBaFw0zODAxMTUxMjAwMDBaMGExCzAJBgNVBAYTAlVT
