; Waveshare ESP32-S3-POE-ETH-8DI-8DO
; Module: ESP32-S3-WROOM-1U-N16R8 (16MB QIO flash, 8MB octal PSRAM)
; https://www.waveshare.com/wiki/ESP32-S3-POE-ETH-8DI-8DO

[env:esp32-s3-poe-eth-8di-8do]
; Waveshare demos require arduino-esp32 >= 3.0; the official PlatformIO
; espressif32 platform still ships 2.x, so use the community pioarduino fork.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; Match the N16R8 module (devkitc-1 defaults to 8MB flash, no PSRAM)
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags =
    -D BOARD_HAS_PSRAM
    ; Native USB-C port: serial over USB CDC
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
